<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مینی اپ من</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Tahoma, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      width: 100%;
      max-width: 350px;
    }
    h1 { font-size: 22px; margin-bottom: 10px; }
    button {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      padding: 14px 30px;
      border-radius: 12px;
      font-size: 16px;
      margin-top: 15px;
      cursor: pointer;
      font-family: inherit;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>سلام <span id="username">دوست عزیز</span>! 👋</h1>
    <p>به اولین مینی اپ من خوش اومدی</p>
    <button onclick="sayHello()">روی من بزن!</button>
  </div>

  <script>
    // اتصال به تلگرام
    const tg = window.Telegram.WebApp;
    tg.ready();        // آماده‌سازی اپ
    tg.expand();       // تمام صفحه کردن

    // گرفتن اسم کاربر
    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('username').textContent = user.first_name;
    }

    // دکمه کلیک شد
    function sayHello() {
      tg.HapticFeedback.impactOccurred('medium'); // ویبره
      tg.showAlert('سلام! این اولین مینی اپ توئه 🎉');
    }
  </script>
</body>
</html>
